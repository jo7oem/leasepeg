openapi: "3.0.0"
servers:
  - url: "http://localhost:8080"
    description: "sample"
info:
  version: "0.0.1"
  title: "Minimal ping API server"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
security:
  - basicAuth: []
paths:
  /healthcheck/live:
    get:
      summary: "healthcheck about process liveness"
      operationId: "GetHealthcheckLive"
      security: []
      responses:
        '200':
          description: "healthcheck response about process liveness"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthcheckLiveResp'
  /healthcheck/ready:
    get:
      summary: "healthcheck about process readiness"
      operationId: "GetHealthcheckReady"
      security: []
      responses:
        '200':
          description: healthcheck response about process readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthcheckReadyResp'
        '500':
          description: healthcheck response about process internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthcheckReadyResp'
        '503':
          description: healthcheck response about process not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthcheckReadyResp'
  /ping:
    get:
      summary: "echo your IP address API"
      operationId: "GetPing"
      security: []
      responses:
        '200':
          description: response to request address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    healthcheckStatus:
      type: string
      enum:
        - starting
        - ready
        - degraded
        - error
        - shutting_down
    healthcheckLiveResp:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "ready"
    healthcheckReadyResp:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/healthcheckStatus'
          example: "ready"
        message:
          type: string
          example: "ready to serve requests"
    Pong:
      type: object
      required:
        - src_addr
      properties:
        src_addr:
          type: string
          example: "203.0.113.0"
