services:
  postgres:
    image: postgres:18
    container_name: postgres
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
  migrate:
    image: migrate/migrate:latest
    profiles:
      - migrate
    depends_on:
      - postgres
    volumes:
      - ./sql/postgress/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgress:5432/mydatabase?sslmode=disable", "up"]
  redoc-cli:
    image: redocly/cli:latest
    profiles:
      - lint
    volumes:
      - .:/workspace
    environment:
      REDOCLY_TELEMETRY: "off"
    working_dir: /workspace
    command:
      - lint
      - --config
      - .redocly.yaml
      - gateway/rest/rest.yaml
volumes:
  pg_data:


