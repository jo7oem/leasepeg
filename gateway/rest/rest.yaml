openapi: "3.0.0"
info:
  version: 1.0.0
  title: Minimal ping API server
paths:
  /healthcheck:
    get:
      responses:
        '200':
          description: healthcheck response
          content:
            application/json:
              schema:
                type: object
                required:
                    - status
                properties:
                  status:
                    type: string
                    example: ok
  /ping:
    get:
      responses:
        '200':
          description: response to request address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    # base types
    Pong:
      type: object
      required:
        - src_addr
      properties:
        src_addr:
          type: string
          example: "203.0.113.0"