openapi: "3.0.0"
info:
  version: 0.0.1
  title: Minimal ping API server
paths:
  /healthcheck/live:
    get:
      responses:
        '200':
          description: healthcheck response about process liveness
          content:
            application/json:
              schema:
                $ref: '#/components/healthcheckLiveResponse'
  /healthcheck/ready:
    get:
      responses:
        '200':
          description: healthcheck response about process readiness
          content:
            application/json:
              schema:
                $ref: '#/components/healthcheckReadyResponse'
        '500':
          description: healthcheck response about process internal error
          content:
            application/json:
              schema:
                $ref: '#/components/healthcheckReadyResponse'
        '503':
          description: healthcheck response about process not ready
          content:
            application/json:
              schema:
                $ref: '#/components/healthcheckReadyResponse'
  /ping:
    get:
      responses:
        '200':
          description: response to request address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
components:
  healthcheckStatus:
    type: string
    enum:
      - starting
      - ready
      - degraded
      - error
      - shutting_down
  healthcheckLiveResponse:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        example: "ready"
  healthcheckReadyResponse:
    type: object
    required:
      - status
    properties:
      status:
        $ref: '#/components/healthcheckStatus'
        example: "ready"
      message:
        type: string
        example: "ready to serve requests"
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    # base types
    Pong:
      type: object
      required:
        - src_addr
      properties:
        src_addr:
          type: string
          example: "203.0.113.0"
